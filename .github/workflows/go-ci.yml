# Reusable CI for every Go repo in this org.
#
# Called from each repo's .github/workflows/ci.yml:
#
#   jobs:
#     ci:
#       uses: KilangDesaMurniBatik/lib-common/.github/workflows/go-ci.yml@main
#
# The Go version is read from the caller's go.mod, never pinned here -- the
# workflows this replaced all pinned 1.22 against a go.mod that says 1.24, so
# every one of them would have failed on the first run.
#
# The three checks can be relaxed per repo while existing debt is cleared. Each
# caller that sets one to false says how much debt and which ticket covers it.

name: Go CI

on:
  workflow_call:
    inputs:
      enforce-gofmt:
        description: "Fail the build when gofmt reports unformatted files."
        type: boolean
        default: true
      enforce-vet:
        description: "Fail the build when go vet reports a problem."
        type: boolean
        default: true
      enforce-tests:
        description: "Fail the build when go test fails."
        type: boolean
        default: true
      main-package:
        description: "Package to build, e.g. ./cmd/server. Empty builds ./... only."
        type: string
        default: ""
    secrets:
      LIB_COMMON_TOKEN:
        description: >-
          Token that can read KilangDesaMurniBatik/lib-common. Required for every repo whose
          go.mod replaces lib-common with a local path, because the default GITHUB_TOKEN is
          scoped to the calling repository only and cannot read a second private repo.
          Unset is allowed so lib-common's own CI (which has no such dependency) still runs.
        required: false

jobs:
  ci:
    name: gofmt · vet · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every service reaches lib-common through `replace => ../lib-common`, a path that
      # only exists on a developer's laptop. CI checks out one repo, so without this the
      # module cannot resolve and golangci-lint exits 3 while go test fails to build. We
      # check lib-common out inside the workspace and repoint the replace at it; go.mod is
      # never committed from here, the edit lives and dies with the runner. (DMB-69)
      - name: Check out lib-common when this repo depends on it
        id: libcommon
        run: |
          if grep -q 'lib-common' go.mod; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "This repo does not depend on lib-common; nothing to do."
          fi

      - uses: actions/checkout@v4
        if: steps.libcommon.outputs.needed == 'true'
        with:
          repository: KilangDesaMurniBatik/lib-common
          ref: main
          token: ${{ secrets.LIB_COMMON_TOKEN || github.token }}
          path: .lib-common

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Repoint the lib-common replace at the checkout
        if: steps.libcommon.outputs.needed == 'true'
        run: |
          module=$(grep -oE 'github\.com/[^/]+/lib-common' go.mod | head -1)
          echo "Repointing $module -> ./.lib-common"
          go mod edit -replace "$module=./.lib-common"

      - name: Download dependencies
        run: go mod download

      - name: gofmt
        run: |
          # .lib-common is a checkout of another repo, not ours to format. go vet, build and
          # test ignore it already because it carries its own go.mod, but gofmt walks the
          # filesystem and would report its files as ours.
          unformatted=$(find . -name '*.go' -not -path './.lib-common/*' -not -path './vendor/*' -print0 \
            | xargs -0 -r gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::group::Unformatted files"
            echo "$unformatted"
            echo "::endgroup::"
            count=$(echo "$unformatted" | wc -l)
            if [ "${{ inputs.enforce-gofmt }}" = "true" ]; then
              echo "::error::$count file(s) are not gofmt-clean. Run: gofmt -w ."
              exit 1
            fi
            echo "::warning::$count file(s) are not gofmt-clean (not enforced in this repo yet)."
          else
            echo "All files are gofmt-clean."
          fi

      - name: go vet
        run: |
          if go vet ./... 2>vet.log; then
            echo "go vet clean."
          else
            echo "::group::go vet"
            cat vet.log
            echo "::endgroup::"
            if [ "${{ inputs.enforce-vet }}" = "true" ]; then
              echo "::error::go vet reported problems."
              exit 1
            fi
            echo "::warning::go vet reported problems (not enforced in this repo yet)."
          fi

      - name: go build
        run: |
          go build ./...
          if [ -n "${{ inputs.main-package }}" ]; then
            go build -o /tmp/service "${{ inputs.main-package }}"
          fi

      - name: go test
        run: |
          if go test -race ./... ; then
            echo "Tests passed."
          elif [ "${{ inputs.enforce-tests }}" = "true" ]; then
            echo "::error::go test failed."
            exit 1
          else
            echo "::warning::go test failed (not enforced in this repo yet)."
          fi
